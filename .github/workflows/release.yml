name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev,api]"
      - name: Require a tag matching the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os; from importlib.metadata import version;
          expected = 'v' + version('iocforge-lab'); actual = os.environ['RELEASE_TAG'];
          assert actual == expected, f'tag {actual!r} must match package version {expected!r}'"
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: python -m build
      - name: Generate SPDX SBOM for release artifacts
        uses: anchore/sbom-action@v0
        with:
          path: dist
          artifact-name: iocforge-lab-sbom
          output-file: dist/iocforge-lab.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
