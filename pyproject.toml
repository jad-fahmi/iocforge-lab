[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iocforge-lab"
version = "0.1.0"
description = "Threat intelligence enrichment for IPs, domains, URLs and hashes"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
ioc-enrich = "ioc_enricher.cli:main"

[tool.setuptools.packages.find]
include = ["ioc_enricher*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=ioc_enricher --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["ioc_enricher", "tests"]

[tool.ruff.lint]
select = ["F", "I", "B"]

[tool.mypy]
python_version = "3.10"
files = ["ioc_enricher"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
